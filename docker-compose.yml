version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql+asyncpg://postgres:postgres@db:5432/test_med_services
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=my_user
      - REDIS_PASSWORD=my_user_password
    depends_on:
      - db
      - redis
    volumes:
      - .:/med_services

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=test_med_services
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: redis-server --requirepass my_user_password --loadmodule /usr/lib/redis/modules/redisearch.so
    environment:
      - REDIS_USERNAME=my_user
      - REDIS_PASSWORD=my_user_password
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: